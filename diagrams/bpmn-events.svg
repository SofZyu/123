<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <style>
    .label { font-family: Arial, sans-serif; font-size: 14px; fill: #1b1f23; }
    .title { font-size: 18px; font-weight: bold; }
    .lane { fill: #f8f9fb; stroke: #c9d1d9; stroke-width: 1; }
    .task { fill: #ffffff; stroke: #1971c2; stroke-width: 1.5; rx: 8; ry: 8; }
    .event { fill: #ffffff; stroke: #2b8a3e; stroke-width: 2; }
    .gateway { fill: #ffffff; stroke: #f08c00; stroke-width: 2; }
    .flow { stroke: #495057; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057" />
    </marker>
  </defs>

  <text x="24" y="30" class="label title">BPMN: Проведение библиотечного мероприятия</text>

  <rect x="20" y="50" width="1160" height="150" class="lane" />
  <text x="30" y="70" class="label">Координатор</text>
  <rect x="20" y="220" width="1160" height="150" class="lane" />
  <text x="30" y="240" class="label">Участники</text>

  <circle cx="80" cy="125" r="18" class="event" />
  <text x="40" y="160" class="label">Идея события</text>

  <rect x="150" y="95" width="170" height="60" class="task" />
  <text x="164" y="130" class="label">Определяет формат</text>

  <rect x="360" y="95" width="170" height="60" class="task" />
  <text x="374" y="130" class="label">Готовит программу</text>

  <polygon points="570,105 600,135 570,165 540,135" class="gateway" />
  <text x="520" y="185" class="label">Есть спикер?</text>

  <rect x="640" y="95" width="170" height="60" class="task" />
  <text x="654" y="130" class="label">Подтверждает спикера</text>

  <rect x="860" y="265" width="190" height="60" class="task" />
  <text x="874" y="300" class="label">Регистрация участников</text>

  <rect x="860" y="95" width="190" height="60" class="task" />
  <text x="874" y="130" class="label">Проводит мероприятие</text>

  <circle cx="1120" cy="125" r="18" class="event" />
  <text x="1088" y="160" class="label">Завершено</text>

  <path d="M 98 125 L 150 125" class="flow" />
  <path d="M 320 125 L 360 125" class="flow" />
  <path d="M 530 125 L 540 135" class="flow" />
  <path d="M 600 135 L 640 125" class="flow" />
  <path d="M 810 125 L 860 125" class="flow" />
  <path d="M 1050 125 L 1102 125" class="flow" />

  <path d="M 600 135 L 730 135 L 730 295 L 860 295" class="flow" />
  <text x="700" y="285" class="label">Анонс</text>

  <rect x="640" y="265" width="170" height="60" class="task" />
  <text x="654" y="300" class="label">Публикует анонс</text>
  <path d="M 730 295 L 730 155" class="flow" />
</svg>
