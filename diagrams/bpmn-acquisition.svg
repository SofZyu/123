<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <style>
    .label { font-family: Arial, sans-serif; font-size: 14px; fill: #1b1f23; }
    .title { font-size: 18px; font-weight: bold; }
    .lane { fill: #f8f9fb; stroke: #c9d1d9; stroke-width: 1; }
    .task { fill: #ffffff; stroke: #364fc7; stroke-width: 1.5; rx: 8; ry: 8; }
    .event { fill: #ffffff; stroke: #2b8a3e; stroke-width: 2; }
    .gateway { fill: #ffffff; stroke: #f59f00; stroke-width: 2; }
    .flow { stroke: #495057; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057" />
    </marker>
  </defs>

  <text x="24" y="30" class="label title">BPMN: Комплектование фонда</text>

  <rect x="20" y="50" width="1160" height="150" class="lane" />
  <text x="30" y="70" class="label">Отдел комплектования</text>
  <rect x="20" y="220" width="1160" height="150" class="lane" />
  <text x="30" y="240" class="label">Поставщик</text>

  <circle cx="80" cy="125" r="18" class="event" />
  <text x="44" y="160" class="label">Потребность</text>

  <rect x="160" y="95" width="170" height="60" class="task" />
  <text x="176" y="130" class="label">Формирует заявку</text>

  <polygon points="380,105 410,135 380,165 350,135" class="gateway" />
  <text x="324" y="185" class="label">Есть бюджет?</text>

  <rect x="440" y="95" width="170" height="60" class="task" />
  <text x="455" y="130" class="label">Согласование закупки</text>

  <rect x="660" y="265" width="170" height="60" class="task" />
  <text x="676" y="300" class="label">Поставка книг</text>

  <rect x="660" y="95" width="170" height="60" class="task" />
  <text x="676" y="130" class="label">Приемка и учет</text>

  <rect x="880" y="95" width="190" height="60" class="task" />
  <text x="896" y="130" class="label">Каталогизация</text>

  <circle cx="1120" cy="125" r="18" class="event" />
  <text x="1090" y="160" class="label">Фонд обновлен</text>

  <path d="M 98 125 L 160 125" class="flow" />
  <path d="M 330 125 L 350 135" class="flow" />
  <path d="M 410 135 L 440 125" class="flow" />
  <path d="M 610 125 L 660 125" class="flow" />
  <path d="M 830 125 L 880 125" class="flow" />
  <path d="M 1070 125 L 1102 125" class="flow" />

  <path d="M 410 135 L 520 135 L 520 295 L 660 295" class="flow" />
  <text x="470" y="285" class="label">Заказ</text>

  <rect x="440" y="265" width="170" height="60" class="task" />
  <text x="456" y="300" class="label">Отправка заказа</text>
  <path d="M 610 125 L 610 295 L 440 295" class="flow" />
  <path d="M 830 295 L 830 155" class="flow" />
</svg>
